# Shared formatting configuration for every Python sample in this repository.
# Each sample keeps its own requirements.txt; this file only configures tools.

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '''
/(
    migrations
  | \.venv
  | venv
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_glob = ["*/migrations/*"]
# Each sample is its own import root, so its apps count as first-party.
src_paths = [
  "TradeCore/tradecore",
  "aviyel/aviyel_api",
  "notification-app/notificationAPI",
]
