name: Independent sample checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [TradeCore/tradecore, aviyel/aviyel_api, notification-app/notificationAPI]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    env:
      SECRET_KEY: ci-only-secret-key-for-isolated-tests-12345678901234567890
      DJANGO_DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.directory }}/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py test --noinput
  notification-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-app/notificationFrontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: notification-app/notificationFrontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run build
